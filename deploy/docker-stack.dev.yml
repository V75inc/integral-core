# Docker Swarm dev stack — external/managed Postgres; deployed as stack ``integral-dev``.
#
# Split-host routing (two URLs):
#   DOMAIN      → web (SPA)
#   DOMAIN_API  → api
# Runtime .env.deploy: JVSPATIAL_CORS_ORIGINS + APP_BASE_URL = https://DOMAIN (web).
# CI build: VITE_API_URL = https://DOMAIN_API (baked into WEB_IMAGE). See deploy/.env.dev.example.
#
# Application keys in DEV_ENV_FILE / .env.deploy (ADMIN_EMAIL, RESEND_*, OPENAI_API_KEY, etc.)
# are merged into the API container via deploy/ci-generate-api-env-overlay.sh at CI
# time (docker-stack.api-env.overlay.yml). Swarm does not support env_file.
# Stack-owned infra (AGENTIVE_*, log DB path) stays in this file — overlay cannot override.
#
# This stack does NOT run an in-stack ``db`` service. The API connects to an
# external/managed Postgres: set POSTGRES_HOST / POSTGRES_USER / POSTGRES_PASSWORD /
# POSTGRES_DB (and optionally POSTGRES_PORT) in .env.deploy. POSTGRES_* is excluded from
# the api-env overlay and interpolated into the api service below at deploy time
# (set -a && source .env.deploy && set +a && docker stack deploy ...). main.py composes
# JVSPATIAL_POSTGRES_DSN from POSTGRES_* at API boot.

version: "3.8"

services:
  api:
    image: ${API_IMAGE:?set API_IMAGE in .env.deploy}
    environment:
      JVSPATIAL_HOST: "0.0.0.0"
      JVSPATIAL_PORT: "4000"
      HOST: "0.0.0.0"
      PORT: "4000"
      JVSPATIAL_DEBUG: "true"
      # Integral Settings reads DEBUG, not JVSPATIAL_DEBUG; the default
      # is False, so opt this non-production stack in explicitly.
      DEBUG: "True"
      EMBEDDING_STORE_PATH: /data/integral_embeddings.db
      JVSPATIAL_DB_TYPE: postgres
      JVSPATIAL_PG_GIN_INDEX: "off"
      JVSPATIAL_POSTGRES_MAX_POOL_SIZE: "10"
      POSTGRES_USER: ${POSTGRES_USER:-integral}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integral}
      POSTGRES_DB: ${POSTGRES_DB:-integral_dev}
      POSTGRES_HOST: ${POSTGRES_HOST:?set POSTGRES_HOST in .env.deploy (external Postgres)}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      JVSPATIAL_JWT_SECRET_KEY: ${JVSPATIAL_JWT_SECRET_KEY}
      JVSPATIAL_CORS_ORIGINS: ${JVSPATIAL_CORS_ORIGINS}
      JVSPATIAL_CORS_HEADERS: ${JVSPATIAL_CORS_HEADERS:-Content-Type,Authorization,X-API-Key,X-Integral-Scope}
      APP_BASE_URL: ${APP_BASE_URL}
      JVAGENT_UPDATE_MODE: ${JVAGENT_UPDATE_MODE:-source}
      # Pinned, not ${...}: >1 uvicorn worker breaks chat (per-process turn
      # registry + WS fan-out, ADR-004) and the boot check only WARNS. The
      # api-env overlay also denies WEB_CONCURRENCY/WORKERS, so raising this
      # is a deliberate edit to this file once ADR-004 is resolved.
      WEB_CONCURRENCY: "1"
      JVSPATIAL_LOG_DB_TYPE: sqlite
      JVSPATIAL_LOG_DB_PATH: /tmp/integral_logs.db
    volumes:
      - integral_data:/data
    networks:
      - edge
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.swarm.network=edge
        - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-integral-dev}-api.rule=Host(`${DOMAIN_API}`)
        - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-integral-dev}-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
        - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-integral-dev}-api.tls=true
        - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-integral-dev}-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
        - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-integral-dev}-api.priority=100
        - traefik.http.services.${TRAEFIK_ROUTER_PREFIX:-integral-dev}-api.loadbalancer.server.port=4000
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE in .env.deploy}
    environment:
      # frontend/nginx.conf is an envsubst template rendered at container
      # start. This stack is split-host (DOMAIN vs DOMAIN_API), so the SPA
      # calls the API cross-origin and connect-src must name that origin —
      # 'self' alone would block every XHR. Set CSP_EXTRA_CONNECT in
      # .env.deploy to "https://<DOMAIN_API> wss://<DOMAIN_API>".
      #
      # Both CSP_* keys are declared here even when empty so envsubst always
      # has a value to substitute; an entirely absent variable would leave the
      # literal ${...} in the rendered policy.
      NGINX_ENVSUBST_FILTER: "^CSP_"
      # CSP connect-src defaults to the API origin this image was BUILT with
      # (frontend/docker-entrypoint.d/15-csp-connect-default.envsh derives it
      # from the VITE_API_URL build arg), so no value is needed here for the
      # normal split-host case. Uncomment only to ADD an origin the SPA calls
      # beyond its own API — a second API host, an analytics endpoint.
      #
      # Do NOT set it to an empty string: envsubst would then render an empty
      # connect-src extra and the derived default is lost, which fails in the
      # browser only, with every healthcheck still green.
      # CSP_EXTRA_CONNECT: "https://extra.example.com wss://extra.example.com"
      # CSP_EXTRA_IMG: "https://cdn.example.com"
    networks:
      - edge
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.swarm.network=edge
        - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-integral-dev}-web.rule=Host(`${DOMAIN}`)
        - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-integral-dev}-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
        - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-integral-dev}-web.tls=true
        - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-integral-dev}-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
        - traefik.http.services.${TRAEFIK_ROUTER_PREFIX:-integral-dev}-web.loadbalancer.server.port=80
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s


networks:
  edge:
    external: true

volumes:
  integral_data:
