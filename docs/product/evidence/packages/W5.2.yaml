browser_readback: >-
  Exact-candidate PostgreSQL browser recheck on 2026-09-29 used PR #92 candidate
  ca6eec3e11dcfd79a083ba7d822ffbc50cda8cff and isolated database
  core_w52_browser. After installing the extracted Asset Register example,
  three Assets were registered through the authenticated declared
  register_asset operation, each with a succeeded receipt and the declared
  it_equipment category. The list_available_assets operation returned three
  persisted Entry references and a succeeded read receipt; direct PostgreSQL
  inspection confirmed all three Entry rows. In the browser, I selected
  “Suggest for this App”; the created dashboard visibly rendered the Available
  assets metric as 3. This closes the exact-candidate browser and PostgreSQL
  readback gaps for the packaged Asset Register path. It does not qualify
  migrated Business Apps or establish human acceptance of suggestion quality.

  On the earlier candidate 55b37ff33a3a9b9ad0d0494aa9abb5079d47ea73, a local
  SQLite workspace installed the Asset Register example through the browser.
  One available Asset was created through the App's New Asset form (W52 Browser
  QA Laptop, tag W52-QA-001), then the suggested dashboard rendered Available
  assets as 1. That dashboard used the declared available_assets read query
  and exposed no generic Entry drill-through CTA. The isolated server was
  restarted with normal startup rehydration and local SDK source on PYTHONPATH;
  the query result was read back after reload. The Warranties expiring query
  remains excluded because its handler can create a notification. This is
  historical SQLite browser evidence; PostgreSQL coverage is documented above.
