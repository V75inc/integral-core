  Exact code candidate b1809615967cf45372e200706e90c7797392d987 passed the
  combined populated Asset Register contract, dashboard service, Operational
  Model loader, QuerySpec, and MCP OAuth backend suites (211 passed) plus the
  dashboard widget registry frontend suite (9 passed). This requalifies the
  deterministic dispatcher/HTTP/resident/MCP/dashboard contracts on one frozen
  source candidate. PR tip 63e79be64b527e9b1733ab9e35ee4f773cc2770c is a
  documentation-only evidence update on that code tree. The PostgreSQL browser
  and persisted read-receipt journey below is separately bound to browser
  candidate ca6eec3e11dcfd79a083ba7d822ffbc50cda8cff.
  Schema tests verify field-kind-driven widgets, rationale, and preview values
  computed through the saved-dashboard resolver. Candidate
  2436d49bb91c7ec8c6eb1ccc5d74bdb507aa9766 passed a contract regression that
  requested installation twice, confirmed the same App instance remained,
  then created three available assets and read a count of 3 through the
  packaged declared-query dashboard preview. This regression caught and fixed
  extracted-handler resolution being lost during operational-layer sync. The
  complete pinned schema corpus was rerun against this candidate on
  2026-09-29. The command found five manifests (CRM, Documents, Guyana Payroll, Org App, Sales),
  18 Tracks, and 234 declared fields. It emitted 54 widgets with rationale
  and previews; all 30 emitted custom-field references resolved to a field
  declared on that widget's Track. A PostgreSQL-backed run of the prior
  candidate's dashboard service and App dashboard tests passed 33 tests.
