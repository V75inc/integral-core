limits: >-
  Browser smoke installed Guyana Payroll in an isolated QA workspace with seed
  and synthetic data. The saved suggestions omitted an overdue count based on
  ordinary dates and omitted pay-date offsets from additive totals, while still
  retaining a generic Settings record count. This package declares zero query
  capabilities, so aggregate cards had no live values and chart drill-through
  correctly returned 403 under the packaged-App query boundary. Populated
  migrated Apps with declared queries and human acceptance of recommendation
  quality remain open; W5.2 is incomplete for that gate. W0.3b live-model
  qualification remains a separate external gate. The Asset Register browser
  run used no model provider and therefore does not qualify `Suggest for this
  App` or the natural-language App skill. Its first tool import failed until
  the separately published SDK source was mounted into the isolated API
  container. This is an environment dependency, not proof of an independent
  App wheel/install defect; the independent SDK/App artifact gate remains the
  authority for that claim.
