readback: >-
  Schema tests verify field-kind-driven widgets, rationale, and preview values
  computed through the saved-dashboard resolver. Full `make verify` passed on
  candidate 0502a489368ed648ec22ba07f6469e46c59c44a1, including backend CI and
  full-suite lanes, wheel verification, frontend lint/type checks, and 208
  frontend test files with 1,256 tests. The manifest smoke confirmed CRM opportunity value,
  close-date, and stage suggestions; payroll gross-total, period-start, and
  status suggestions; and CRM opportunity value remained suggested when all
  CRM Tracks were presented together. A subsequent PostgreSQL-backed run of
  tests/test_dashboard_service.py and tests/test_app_dashboards.py passed all
  33 tests. An additional manifest-driven run of the actual suggestion
  function covered five tracked Apps, 18 Tracks, and 234 declared fields.
  All 54 emitted widgets carried rationale and preview fields; all 31
  field references resolved to a field declared on the widget's Track.
  The run is reproducible with
  `uv run python ../scripts/qualify_dashboard_suggestion_manifests.py
  --business-repo /Users/eldonmarks/Briefcase/dev/integral-business
  --revision d0e08d9b0af08d9615a687d84629853f1b1e7c83` from `backend/`.
  On integrated candidate 3da6199ff4aa1c0405562f5d9f9d348e7b504786,
  a fresh isolated browser workspace installed Core's external Asset Register
  example. Three synthetic Assets were registered through the declared typed
  operation, each with a succeeded receipt, object reference, and package
  provenance. The declared availability query returned all three; the 45-day
  warranty query returned the two expected records. Browser readback showed
  all three records in Feed and Inventory and the two warranty dates in the
  October calendar. The generic Entry form correctly rejected a write to
  protected App fields. Details and limits are in the integrated-candidate
  browser recheck.
