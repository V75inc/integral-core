        acceptance_note: "Durable event normalization, exact WorkItem replay scope, cursor pagination/gap reporting, and PostgreSQL append/replay probes passed. Stable assistant transcript persistence is fenced and idempotent; cancellation is audited as chat_turn.cancel. Focused worker/submission PostgreSQL suite: 30 passed, including recovery after the terminal event and stable transcript were committed before a simulated worker death; both retries completed without a second provider call. A stream that ends without message-finish now terminalizes failed with a durable error rather than projecting partial output as success. New coverage bounds accepted durable turns with a persisted deadline, cancels a hung provider task, preserves committed partial output, and terminalizes the WorkItem with a durable timeout error. Two independent PostgreSQL worker processes race one chat WorkItem claim; exactly one receives fence 1. A separate child process exits abruptly after a committed claim; focused PostgreSQL recovery reclaims it under fence 2. PostgreSQL recovery reads encrypted dispatch_intent-only and dispatch_intent-plus-outcome_unknown records and blocks before checkpoint loading/replay. Earlier spawned-process tests committed synthetic observer records and proved recovery blocks before checkpoint load (12 focused worker tests pass). On 2026-10-05, the crash probe drove the production LiteLLMSDKTransport through httpx with a fake in-process SDK completion: one child died after persisted dispatch intent, and another after consuming a partial stream chunk. Both confirmed exactly one completion entry and fail-closed recovery (2 PostgreSQL cases passed); no external provider was contacted. The isolated native browser stack passed scaffold-design/confirmation-boundary and read-only workspace/track lookup smokes; repeated real-input lookups after browser access was restored continue to return the verified workspace and zero tracks with usage metadata. Reload restored the chat and metadata on the existing /messages path. This is not durable WorkItem browser replay/reconnect evidence. Producer and worker dispatch remain disabled; external-provider crash semantics, durable browser replay/reconnect, and independent WP-09 review remain open. The separate 9010 jvagent chat was inspected without retrying it; it remains existing legacy-path evidence only."
