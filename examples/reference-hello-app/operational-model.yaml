# Reference Hello App — F0/F2 external package contract proof.
#
# Lives outside backend/app/packages/ and is installed only via
# INTEGRAL_PACKAGE_PATHS. Core must not require this package to boot.
#
# F2 Phase One: ships App-owned declarative view_types[] composites that
# render via Core palette widgets — no Core frontend registry edit.
integral_operational_model_version: 3
scope: app
package:
  name: Reference Hello
  slug: reference-hello-app
  class: community_app
  version: 1.1.0
  trust_tier: trusted
  publisher: Integral Foundation
  description: Minimal external App that proves the F0/F2 extension contract.
  tags:
  - reference
  - hello
  - contract-test

# App-owned composite — resolves to Core ``composable_board`` at compile.
view_types:
- key: hello_board
  base: composable_board
  label: Hello board
  description: Notes board composite owned by the reference App package.
  config:
    group_by: title

app:
  description: One track, one entry type, one declarative hook, one tool, one skill, App-owned views.
  extension_views:
  - key: hello_panel
    name: Hello Panel
    description: Sandboxed iframe panel served from the package bundle.
    entry: views/hello_panel/index.html
    scope: track
  tracks:
  - key: notes
    name: Notes
    description: Simple notes for the reference App contract test.
    entry_types:
    - key: note
      name: Note
      icon: sticky-note
      fields:
      - key: body
        name: Body
        type: markdown
      base_fields:
        title:
          label: Title
          order: 0
    views:
    - key: notes_feed
      name: Notes
      view_type: feed
      entry_type_keys: [note]
      default_entry_type: note
      is_default: true
    - key: notes_hello_board
      name: Hello board
      view_type: hello_board
      entry_type_keys: [note]
      default_entry_type: note
    - key: notes_hello_panel
      name: Hello Panel
      view_type: extension_view
      extension_view_key: hello_panel
      entry_type_keys: [note]
  tools:
  - key: echo
    name: Echo
    description: Echoes a message back — contract-test tool surface.
    handler_ref: tools.hello:echo
    parameters_schema:
      type: object
      properties:
        message:
          type: string
      required: [message]
  hooks:
  - key: note_created
    point: entry.create
    mode: tool
    match:
      entry_type: note
    tool: echo
  operations:
  - key: echo
    kind: execute
    name: Echo message
    description: Run the echo tool via the typed operation surface.
    policy_action: app.read
    staging_level: none
    tool: echo
    input_schema:
      type: object
      properties:
        message:
          type: string
      required: [message]
  skills:
  - key: hello_world
    name: Hello World
    kind: declarative
    description: Greets the workspace and confirms the reference App is installed.
    prompt_template: skills/hello_world/SKILL.md

migrations: []
