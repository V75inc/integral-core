integral_profile_version: 2
scope: track
package:
  name: Agent Scratch
  slug: agent-scratch
  class: core_package
  version: 1.0.0
  description: 'Per-user agent scratch App — ephemeral working memory for agent reasoning. Four entry types: observation,
    plan, hypothesis, memory. Provisioned in the user''s personal workspace on first agent connect.'
track:
  entry_types:
  - key: observation
    name: Observation
    icon: eye
    fields:
    - key: topic
      name: Topic
      type: text
      index: true
    - key: source
      name: Source
      type: text
      index: true
    - key: confidence
      name: Confidence
      type: select
      enum:
      - low
      - medium
      - high
      index: true
    base_fields:
      title:
        label: Title
        placeholder: What did the agent observe?
        order: 0
      body:
        label: Detail
        placeholder: Full context, raw quotes, notes
        order: 1000
  - key: plan
    name: Plan
    icon: list-checks
    fields:
    - key: status
      name: Status
      type: select
      enum:
      - draft
      - active
      - completed
      - abandoned
      index: true
    - key: due
      name: Due
      type: date
      index: true
    base_fields:
      title:
        label: Plan
        placeholder: What is the agent planning to do?
        order: 0
      body:
        label: Steps
        placeholder: Step-by-step breakdown
        order: 1000
  - key: hypothesis
    name: Hypothesis
    icon: flask-conical
    fields:
    - key: status
      name: Status
      type: select
      enum:
      - proposed
      - testing
      - confirmed
      - refuted
      index: true
    base_fields:
      title:
        label: Hypothesis
        placeholder: What is the testable claim?
        order: 0
      body:
        label: Reasoning
        placeholder: Why might this be true? What would confirm/refute it?
        order: 1000
  - key: memory
    name: Memory
    icon: brain
    fields:
    - key: tag
      name: Tag
      type: text
      index: true
    base_fields:
      title:
        label: Recall
        placeholder: Short label for retrieval
        order: 0
      body:
        label: Content
        placeholder: The remembered detail
        order: 1000
  defaults:
    default_entry_type: observation
    default_view: scratch_feed
  views:
  - key: scratch_feed
    name: Feed
    view_type: feed
    is_default: true
  - key: active_plans
    name: Active plans
    view_type: table
    entry_type_keys:
    - plan
    columns:
    - field: title
      label: Plan
      sortable: true
    - field: custom_fields.status
      label: Status
      sortable: true
    - field: custom_fields.due
      label: Due
      sortable: true
  - key: hypotheses
    name: Hypotheses
    view_type: table
    entry_type_keys:
    - hypothesis
    columns:
    - field: title
      label: Hypothesis
      sortable: true
    - field: custom_fields.status
      label: Status
      sortable: true
  taxonomy:
    tag_groups: []
