# Personal Context — the App that pays attention to the person.
#
# Display name and slug are deliberately declared ONCE (package.name /
# package.slug below) and referenced nowhere else in this bundle, so a
# rename is a one-line change plus a directory rename (I-BUNDLE-04 ties
# the directory name to the slug).
#
# Phase 1 (this file) is schema only: tracks, entry types, belief fields,
# views, settings, and the entry.create/entry.update hook wired to a
# no-op tool stub. Skills, the agent that carries the schedules, and the
# real observe_entry body land in later phases — declaring a skill key
# before skills/<key>/SKILL.md exists fails I-BUNDLE-02, so each phase
# adds its manifest surface and its files together.
# personal-context and agent-scratch — substrate-owned core packages.
integral_profile_version: 3
scope: app
package:
  name: Personal Context
  slug: personal-context
  class: core_package
  version: 0.1.9
  publisher: V75 Inc.
  publisher_tier: first_party
  trust_tier: trusted   # required: app.tools[] is non-empty
  description: >-
    Pays attention to what you do across Integral and builds a transparent,
    correctable picture of you — the arenas you work in, the people in them,
    what you have committed to, how you decide, how you sound, and when you
    work. Every belief cites the observations it came from, says how sure it
    is and when it was last confirmed, and is superseded rather than deleted
    when you correct it. Browsable as a wiki.
  tags:
  - personal
  - context
  - memory
  - agent

app:
  description: >-
    Your personal context substrate: a verbatim observation stream, the typed
    facts promoted from it, a compiled wiki over those facts, and a log of
    everything the app noticed and did.
  defaults:
    provision_prescribed_tracks: true
    default_track: pages
    default_view: pc_wiki
  permissions:
    install_requires_workspace_role: member
    default_app_role: owner   # personal workspace, owner-only by construction

  tracks:

  # ─────────────────────────────────────────────────────────────────
  # stream — the lining. Verbatim, unstaged, provenance-carrying.
  # ─────────────────────────────────────────────────────────────────
  - key: stream
    name: Stream
    description: >-
      What was noticed, verbatim, with provenance. Interpretation happens at
      promotion, never at the door. Newest first.
    provision_on_create: true
    entry_types:
    - key: observation
      name: Observation
      icon: eye
      fields:
      - key: surface
        name: Surface
        type: select
        enum:
        - chat
        - entry
        - staging
        - connector
        - import
        index: true
      - key: arena
        name: Arena
        type: relation
        relation:
          target: entry
          target_track_types: [arenas]
          target_entry_types: [arena]
          allow_cross_track: true
          many: false
          on_target_uninstall: 'null'
      - key: workspace_ref
        name: Workspace
        type: text
        index: true
      - key: interaction_ref
        name: Interaction
        type: text
        index: true
      - key: entry_ref
        name: Entry
        type: text
        index: true
      - key: excerpt
        name: Excerpt
        type: markdown
      - key: salience
        name: Salience
        type: number
        index: true
      - key: handled
        name: Handled
        type: select
        enum:
        - pending
        - promoted
        - discarded
        - archived
        index: true
      base_fields:
        title:
          label: Gist
          placeholder: One line — what was noticed
          order: 0
        body:
          label: Excerpt
          placeholder: The verbatim text this was noticed in
          order: 1000
    defaults:
      default_entry_type: observation
      default_view: pc_stream_feed
    views:
    - key: pc_stream_feed
      name: Stream
      view_type: feed
      entry_type_keys: [observation]
      default_entry_type: observation
      is_default: true
    - key: pc_stream_pending
      name: Pending
      view_type: table
      entry_type_keys: [observation]
      default_entry_type: observation
      filters:
      - field: custom_fields.handled
        operator: eq
        value: pending
      columns:
      - field: title
        label: Gist
        sortable: true
      - field: custom_fields.surface
        label: Surface
        sortable: true
      - field: custom_fields.salience
        label: Salience
        sortable: true
      - field: created_at
        label: Noticed
        sortable: true

  # ─────────────────────────────────────────────────────────────────
  # identity — who the person is: roles, heuristics, voice, rhythms,
  # ambitions. Every type carries the same belief fields.
  # ─────────────────────────────────────────────────────────────────
  - key: identity
    name: Identity
    description: >-
      Roles, heuristics, voice registers, rhythms and ambitions — each with
      confidence, status, first seen, last confirmed, what superseded it, and
      the observations behind it.
    provision_on_create: true
    entry_types:
    - key: role
      name: Role
      icon: user-round
      fields:
      - key: confidence
        name: Confidence
        type: select
        enum: [low, medium, high]
        index: true
      - key: status
        name: Status
        type: select
        enum: [provisional, confirmed, superseded, archived]
        index: true
      - key: first_seen
        name: First seen
        type: datetime
        index: true
      - key: last_confirmed
        name: Last confirmed
        type: datetime
        index: true
      - key: superseded_by
        name: Superseded by
        type: relation
        relation:
          target: entry
          target_entry_types: [role, heuristic, voice, rhythm, ambition]
          many: false
          on_target_uninstall: 'null'
      - key: sources
        name: Sources
        type: relation
        relation:
          target: entry
          target_track_types: [stream]
          target_entry_types: [observation]
          allow_cross_track: true
          many: true
          on_target_uninstall: 'null'
      base_fields:
        title:
          label: Role
          placeholder: e.g. Product visionary and architect at V75
          order: 0
        body:
          label: What this means
          placeholder: What the role covers, in the person's own terms
          order: 1000
    - key: heuristic
      name: Heuristic
      icon: compass
      fields:
      - key: confidence
        name: Confidence
        type: select
        enum: [low, medium, high]
        index: true
      - key: status
        name: Status
        type: select
        enum: [provisional, confirmed, superseded, archived]
        index: true
      - key: first_seen
        name: First seen
        type: datetime
        index: true
      - key: last_confirmed
        name: Last confirmed
        type: datetime
        index: true
      - key: superseded_by
        name: Superseded by
        type: relation
        relation:
          target: entry
