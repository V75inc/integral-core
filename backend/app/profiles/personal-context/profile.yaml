  # ─────────────────────────────────────────────────────────────────
  # commitments — open loops. Beliefs, with belief fields, staged like
  # every other belief. The decision ledger used to live here and now
  # has its own track: a Decision is a record of an event that happened,
  # not a claim about the person that could turn out to be wrong.
  # ─────────────────────────────────────────────────────────────────
  - key: commitments
    name: Commitments
    description: >-
      What the person owes and is owed, by horizon.
    provision_on_create: true
    entry_types:
    - key: commitment
      name: Commitment
      icon: handshake
      fields:
      - key: direction
        name: Direction
        type: select
        enum: [made, received]
        index: true
      - key: counterparty
        name: Counterparty
        type: relation
        relation:
          target: entry
          target_track_types: [people]
          target_entry_types: [person]
          allow_cross_track: true
          many: false
          on_target_uninstall: 'null'
      - key: horizon
        name: Horizon
        type: date
        index: true
      - key: arena
        name: Arena
        type: relation
        relation:
          target: entry
          target_track_types: [arenas]
          target_entry_types: [arena]
          allow_cross_track: true
          many: false
          on_target_uninstall: 'null'
      - key: state
        name: State
        type: select
        enum: [open, done, dropped]
        index: true
      - key: confidence
        name: Confidence
        type: select
        enum: [low, medium, high]
        index: true
      - key: status
        name: Status
        type: select
        enum: [provisional, confirmed, superseded, archived]
        index: true
      - key: first_seen
        name: First seen
        type: datetime
        index: true
      - key: last_confirmed
        name: Last confirmed
        type: datetime
        index: true
      - key: superseded_by
        name: Superseded by
        type: relation
        relation:
          target: entry
          target_entry_types: [commitment]
          many: false
          on_target_uninstall: 'null'
      - key: sources
        name: Sources
        type: relation
        relation:
          target: entry
          target_track_types: [stream]
          target_entry_types: [observation]
          allow_cross_track: true
          many: true
          on_target_uninstall: 'null'
      base_fields:
        title:
          label: Commitment
          placeholder: What was promised, and to whom
          order: 0
        body:
          label: Detail
          placeholder: The verbatim shape of the commitment
          order: 1000
    defaults:
      default_entry_type: commitment
      default_view: pc_commitments_table
    views:
    - key: pc_commitments_table
      name: Commitments
      view_type: table
      entry_type_keys: [commitment]
      default_entry_type: commitment
      is_default: true
      columns:
      - field: title
        label: Commitment
        sortable: true
      - field: custom_fields.direction
        label: Direction
        sortable: true
      - field: custom_fields.horizon
        label: Horizon
        sortable: true
      - field: custom_fields.confidence
        label: Confidence
        sortable: true
      - field: custom_fields.status
        label: Status
        sortable: true
      - field: custom_fields.last_confirmed
        label: Last confirmed
        sortable: true
      - field: custom_fields.sources
        label: Sources
    - key: pc_commitments_feed
      name: Feed
      view_type: feed
      entry_type_keys: [commitment]
      default_entry_type: commitment

  # ─────────────────────────────────────────────────────────────────
  # decisions — the ledger of what the person blessed, rejected or let
  # expire. Its own track, not a second entry type under commitments,
  # for two reasons that turned out to be the same reason:
  #
  #   1. A Decision is a record of an event. It carries no belief fields
  #      and is never superseded, unlike everything in commitments.
  #   2. The ledger is written unstaged — recording that somebody
  #      approved something cannot itself require approval — and the
  #      staging exemption is a whole-track property (I-PC-01). Sharing
  #      a track with Commitment would have meant exempting beliefs.
  #
  # ADR-007.
  # ─────────────────────────────────────────────────────────────────
  - key: decisions
    name: Decisions
    description: >-
      What was proposed, and what the person did about it: blessed, rejected,
      or left to expire. Written as each approval card resolves.
    provision_on_create: true
    entry_types:
    - key: decision
      name: Decision
      icon: gavel
      fields:
      - key: proposal_kind
        name: Proposal kind
        type: text
        index: true
      - key: outcome
        name: Outcome
        type: select
        enum:
        - blessed
        - edited_then_blessed
        - rejected
        - expired
        index: true
      - key: diff
        name: Diff
        type: markdown
      - key: arena
        name: Arena
        type: relation
        relation:
          target: entry
          target_track_types: [arenas]
          target_entry_types: [arena]
          allow_cross_track: true
          many: false
          on_target_uninstall: 'null'
      - key: token_ref
        name: Token
        type: text
        index: true
      - key: decided_at
        name: Decided at
        type: datetime
        index: true
      base_fields:
        title:
          label: Decision
          placeholder: What was proposed
          order: 0
        body:
          label: Context
          placeholder: What the proposal was and why it went the way it did
          order: 1000
    defaults:
      default_entry_type: decision
      default_view: pc_decisions_table
    views:
    - key: pc_decisions_table
      name: Decisions
      is_default: true
      view_type: table
      entry_type_keys: [decision]
      default_entry_type: decision
      columns:
      - field: title
        label: Proposal
        sortable: true
      - field: custom_fields.outcome
        label: Outcome
        sortable: true
      - field: custom_fields.proposal_kind
        label: Kind
        sortable: true
      - field: custom_fields.decided_at
        label: Decided
        sortable: true
    - key: pc_decisions_feed
      name: Feed
      view_type: feed
      entry_type_keys: [decision]
      default_entry_type: decision

  # ─────────────────────────────────────────────────────────────────
  # pages — the wiki. Compiled from facts; user sections preserved.
  # ─────────────────────────────────────────────────────────────────
  - key: pages
    name: Pages
    description: >-
      The wiki over everything above: About me, Arenas, People, Commitments,
      How I decide, Voice, Rhythms, Decisions. Compiled from the facts, with
      a footer that says how sure and how recent. User-authored sections
      between <!-- user:begin --> and <!-- user:end --> survive recompiles.
    provision_on_create: true
    entry_types:
    - key: page
      name: Page
      icon: book-open
      fields:
      - key: parent
        name: Parent
        type: relation
        relation:
          target: entry
          target_entry_types: [page]
          many: false
          on_target_uninstall: 'null'
      - key: kind
        name: Kind
        type: select
        enum:
        - about
        - arenas
        - arena
        - people
        - person
        - commitments
        - heuristics
        - voice
        - rhythms
        - decisions
        index: true
      - key: compiled_from
        name: Compiled from
        type: relation
        relation:
          target: entry
          target_track_types: [identity, arenas, people, commitments, decisions]
          target_entry_types:
          - role
          - heuristic
          - voice
          - rhythm
          - ambition
          - arena
          - person
          - commitment
          - decision
          allow_cross_track: true
          many: true
          on_target_uninstall: 'null'
      - key: compiled_at
        name: Compiled at
        type: datetime
        index: true
      base_fields:
        title:
          label: Page
          placeholder: Page title
          order: 0
        body:
          label: Body
          placeholder: Compiled narrative — edits here are read as corrections
          order: 1000
    defaults:
      default_entry_type: page
      default_view: pc_wiki
    views:
    - key: pc_wiki
      name: Pages
      view_type: wiki
      entry_type_keys: [page]
      default_entry_type: page
      is_default: true
      parent_field: parent
      body_field: body
      title_field: title
      sort_siblings:
        field: title
        direction: asc

  # ─────────────────────────────────────────────────────────────────
  # attention — the transparency log. Nothing is silent.
  # ─────────────────────────────────────────────────────────────────
  - key: attention
    name: Attention Log
    description: >-
      Everything the app noticed, promoted, asked, archived or compiled — in
      order, with the ids it touched.
    provision_on_create: true
    entry_types:
    - key: attention_event
      name: Attention Event
      icon: activity
      fields:
      - key: kind
        name: Kind
        type: select
        enum:
        - observed
        - promoted
        - asked
        - corrected
        - archived
        - compiled
        index: true
      - key: refs
        name: Refs
        type: json
      - key: summary
        name: Summary
        type: text
        index: true
      base_fields:
        title:
          label: Event
          placeholder: What the app did
          order: 0
        body:
          label: Detail
          placeholder: The reasoning, in full
          order: 1000
    defaults:
      default_entry_type: attention_event
      default_view: pc_attention_feed
    views:
    - key: pc_attention_feed
      name: Attention Log
      view_type: feed
      entry_type_keys: [attention_event]
      default_entry_type: attention_event
      is_default: true

  # ─── Skills ──────────────────────────────────────────────────────
  #
  # Generated from skills/*/SKILL.md by
  # scripts/sync_bundle_skill_manifests.py — description and
  # tools_required must match the SKILL.md frontmatter exactly, so edit
  # the SKILL.md and re-run the script in check mode rather than editing
  # these entries by hand.
  skills:
  - key: context_attend
    name: Context Attend
    kind: declarative
    description: Notices what a just-finished interaction or a just-saved entry reveals about the person
      and records it as a verbatim observation in the Personal Context stream, with provenance and salience.
      Dedupes against existing facts first and bumps confirmation rather than duplicating. Never interprets,
      never asks, never writes a fact.
    prompt_template: skills/context_attend/SKILL.md
    tools_required:
    - integral_list_tracks
    - integral_get_track_schema
    - integral_query_entries
    - integral_create_entry
  - key: context_compile
    name: Context Compile
    kind: declarative
    description: Regenerates the Personal Context wiki from the typed facts — About me, Arenas, People,
      Commitments, How I decide, Voice, Rhythms, Decisions — so every paragraph cites the facts behind it
      and each page carries how sure and how recent it is. Preserves user-authored sections verbatim across
      recompiles.
    prompt_template: skills/context_compile/SKILL.md
    tools_required:
    - integral_list_tracks
    - integral_get_track_schema
    - integral_query_entries
    - integral_get_related
    - integral_create_entry
    - integral_update_entry
  - key: context_correct
    name: Context Correct
    kind: declarative
    description: Applies a person's correction to what the Personal Context App believes — creating the
      replacement fact, marking the old one superseded and linking the two — so a belief is never deleted
      and the history of what was believed stays readable. Triggered by an explicit correction, an edit
      to a compiled wiki page, or a rejection.
    prompt_template: skills/context_correct/SKILL.md
    # Read-only: this skill resolves the swap, context_correct_apply writes it.
    tools_required:
    - integral_list_tracks
    - integral_get_track_schema
    - integral_query_entries
    - integral_get_related
  - key: context_correct_apply
    name: Context Correct Apply
    kind: declarative
    description: Performs a correction that context_correct has already resolved — staging the replacement
      fact, then superseding the old one with a link to it once the replacement's id exists. Runs in the turn
      after the resolution so the write starts with a full budget.
    prompt_template: skills/context_correct_apply/SKILL.md
    tools_required:
    # `use_skill` (step 0's exit) is an orchestrator loop tool, not a
    # catalogue tool — declaring it fails registration. Reachable anyway.
    - integral_get_track_schema
    - integral_create_entry
    - integral_update_entry
    # A correction stages as ONE card carrying both halves.
    - integral_begin_batch
    - integral_commit_batch
    - integral_cancel_batch
  - key: context_decay
    name: Context Decay
    kind: declarative
    description: Lowers salience on Personal Context observations nothing ever drew on, and archives the
      ones that fall below the floor, so the pending stream stays a working queue rather than an ever-growing
      backlog. Never touches a promoted observation or a confirmed fact.
    prompt_template: skills/context_decay/SKILL.md
    tools_required:
    - integral_list_tracks
    - integral_get_track_schema
    - integral_query_entries
    - integral_update_entry
    - integral_create_entry
  - key: context_gap_review
    name: Context Gap Review
    kind: declarative
    description: Asks the person the single highest-value question the Personal Context App cannot answer
      by inference — capped by their question budget, at most one thing at a time, and only when the answer
      would change several beliefs rather than fill one blank.
    prompt_template: skills/context_gap_review/SKILL.md
    tools_required:
    - integral_list_tracks
    - integral_get_track_schema
    - integral_query_entries
    - integral_get_related
    - integral_ask_user
    - integral_create_entry
  - key: context_onboard
    name: Context Onboard
    kind: declarative
    description: The first fitting of the Personal Context App — one conversation plus whatever the person
      already has (personal-crm contacts, knowledge-base pages, a pasted memory export) turned into a first
      set of proposed facts as a single card, so the App starts with a shape instead of an empty wiki.
    prompt_template: skills/context_onboard/SKILL.md
    tools_required:
    - integral_list_apps
    - integral_list_tracks
    - integral_get_track_schema
    - integral_query_entries
    - integral_ask_user
    - integral_create_entry
    - integral_begin_batch
    - integral_commit_batch
    - integral_cancel_batch
  - key: context_promote
    name: Context Promote
    kind: declarative
    description: Turns pending Personal Context observations into typed, confidence-scored facts about the
      person — new beliefs, updates to existing ones, and confirmation bumps — batched into a single daily
      card for review under review_daily, or landed and logged under always. Marks each observation promoted
      or discarded so nothing is considered twice.
    prompt_template: skills/context_promote/SKILL.md
    tools_required:
    - integral_list_tracks
    - integral_get_track_schema
    - integral_query_entries
    - integral_create_entry
    - integral_update_entry
    - integral_begin_batch
    - integral_commit_batch
    - integral_cancel_batch
  - key: context_recall
    name: Context Recall
    kind: declarative
    description: Answers what the Personal Context App believes about the person — roles, arenas, people,
      commitments, heuristics, voice, rhythms — from typed facts only, always with the confidence, when
      it was last confirmed, and the observations behind it. Says plainly when nothing is known rather than
      inferring.
    prompt_template: skills/context_recall/SKILL.md
    tools_required:
    - integral_list_tracks
    - integral_get_track_schema
    - integral_query_entries
    - integral_get_related
  # ─── Agent ───────────────────────────────────────────────────────
  #
  # The App's scheduled hands. default_schedules live on an agent, not on
  # `app:` — the compiler reads them from app.agents[].default_schedules
  # and silently ignores an `app.default_schedules` block, so a schedule
  # declared there would never run.
  #
  # staging: optional — the promotion card is the App's own discipline
  # (promotion_policy), not the agent framework's.
  agents:
  - key: context_attendant
    name: Personal Context Attendant
    persona_ref: agents/attendant.yaml
    skills:
    - context_attend
    - context_promote
    - context_recall
    - context_correct
    - context_compile
    - context_decay
    - context_gap_review
    - context_onboard
    scope: app
    staging: optional
    default_schedules:
    # Promote first, then render what promotion produced. Two entries
    # rather than one skill doing both: a compile that fails should not
    # leave the day's promotions unrecorded, and a promotion that finds
    # nothing should still refresh a page a correction changed.
    - name: nightly_promote
      cron: 0 2 * * *
      skill: context_promote
      params: {}
    - name: nightly_compile
      cron: 30 2 * * *
      skill: context_compile
      params: {}
    - name: weekly_decay
      cron: 0 3 * * 0
      skill: context_decay
      params: {}
    # 09:00 is a guess at "morning" until the App has learned the person's
    # rhythms — at which point this is exactly the kind of thing it should
    # be able to set for itself.
    - name: daily_gap_review
      cron: 0 9 * * *
      skill: context_gap_review
      params: {}

  # ─── Operational layer ───────────────────────────────────────────
  #
  # Phase 1 ships the hook wiring against a documented no-op stub so the
  # binding is reviewable now and the behavior lands in Phase 5 without a
  # manifest change. See tools/observe_entry.py.
  tools:
  - key: observe_entry
    name: Observe entry
    description: >-
      Records an Observation about an entry the person created or edited in
      any app. Ignores this App's own entries and agent-scratch, respects
      attention_enabled and excluded_arenas.
    handler_ref: tools.observe_entry:run
    parameters_schema:
      type: object
    output_schema:
      type: object
  hooks:
  - point: entry.create
    key: pc_observe_create
    mode: tool
    tool: observe_entry
  - point: entry.update
    key: pc_observe_update
    mode: tool
    tool: observe_entry

  # ─── Unstaged write targets (ADR-006 / I-PC-01) ──────────────────
  #
  # The two tracks that accept agent writes without minting an approval
  # card. The approval surface exists so a person can refuse a change to
  # their substrate; filling it with the App's own note-taking, where
  # refusing means only "do not remember that", empties it of meaning.
  #
  # stream    — verbatim observations. Working memory ABOUT the person.
  # attention — the transparency log. Staging the record of what the App
  #             did would be circular.
  # decisions — the ledger. Recording that somebody approved something
  #             cannot itself require approval (ADR-007).
  #
  # Every fact track (identity, arenas, people, commitments) stages, and
  # so does the compiled `pages` track. Declaring the exemption is
  # necessary, never sufficient: the runtime gate also requires this App
  # to be installed in the acting principal's own personal workspace,
  # with that principal as its owner.
  unstaged_tracks:
  - stream
  - attention
  - decisions

  settings_schema:
    type: object
    properties:
      attention_enabled:
        type: boolean
        default: true
        title: Pay attention
        description: >-
          When off, nothing is observed, promoted or asked. Existing facts
          stay exactly as they are.
      excluded_arenas:
        type: array
        items:
          type: string
        default: []
        title: Never observe
        description: >-
          Workspace or App refs the app must never observe. Entries there are
          invisible to it.
      promotion_policy:
        type: string
        enum:
        - review_daily
        - always
        - never
        default: review_daily
        title: How new facts land
        description: >-
          review_daily batches a day's promotions into one card to review.
          always lands them and logs each one. never keeps observations only.
      question_budget:
        type: integer
        minimum: 0
        maximum: 3
        default: 1
        title: Questions per day
        description: >-
          How many things the app may ask you in a day when it cannot infer
          something important.
