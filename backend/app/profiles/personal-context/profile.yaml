      - key: last_confirmed
        name: Last confirmed
        type: datetime
        index: true
      - key: superseded_by
        name: Superseded by
        type: relation
        relation:
          target: entry
          target_entry_types: [role, heuristic, voice, rhythm, ambition]
          many: false
          on_target_uninstall: 'null'
      - key: sources
        name: Sources
        type: relation
        relation:
          target: entry
          target_track_types: [stream]
          target_entry_types: [observation]
          allow_cross_track: true
          many: true
          on_target_uninstall: 'null'
      base_fields:
        title:
          label: Register
          placeholder: e.g. With engineers — terse, evidence-first
          order: 0
        body:
          label: Examples
