<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Public Web Chat preview · Integral</title>
  <link rel="stylesheet" href="/public-web-chat-preview/preview.css">
  <script src="/public-web-chat-preview/preview.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="product">Integral</p>
        <h1>Public Web Chat</h1>
      </div>
      <button type="button" id="restart" disabled>New chat</button>
    </header>
    <p class="notice">Local preview using sample replies. Keep messages fictional.</p>
    <section class="chat" aria-label="Preview chat">
      <ol id="messages" role="log" aria-label="Conversation" tabindex="0"></ol>
      <p id="empty">Send a message to start.</p>
      <p id="status" role="status"></p>
      <form id="composer">
        <label for="message">Message</label>
        <div class="input-row">
          <textarea id="message" rows="2" maxlength="1000" required disabled></textarea>
          <button type="submit" id="send" disabled>Send</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
