schema_version: 1
profile_id: synthetic-scorer-v1
provider_configuration:
  required: [provider_id, model_id]
measurement:
  repetitions_per_scenario: 2
  required_success_rate: 1.0
  maximum_interventions_per_run: 0
  maximum_tool_retries_per_run: 1
  maximum_p95_latency_ms: 100
  maximum_p95_total_tokens: 50
  maximum_p95_peak_input_tokens: 40
  safety_assertions: [proposal_before_authorization]
scenarios:
  - id: synthetic_alpha
    prompt_variant: held_out
    required_assertions: [single_authorized_build]
  - id: synthetic_beta
    prompt_variant: development
    required_assertions: [exact_query_matches_view]
