# Integral Core — CI (open extract)
#
# Pull-request gate: smoke + F0 core_only/contract + substrate guards + frontend.
# Nightly lane runs the full Core suite, including slow tests; commercial Apps
# and tests/domain_apps remain owned by V75inc/integral.
#
name: CI

on:
  # Recover a missed push event without weakening the exact-revision release gate.
  workflow_dispatch:
  pull_request:
    branches: [main, dev, ab/dev2, prod, codex/pr-113-staging, codex/core-rc18-jvspatial-022]
    paths:
      - "backend/**"
      - "sdk/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
      # The guard scripts this workflow runs. Without these, a PR that only
      # edits a substrate guard or the dependency-audit gate skipped CI
      # entirely — the gates could be weakened or broken with nothing to
      # notice. Caught when the Postgres backup PR (scripts/ + docs/ only)
      # produced no CI run at all.
      - ".ci/**"
      - "scripts/**"
      # Portable resident skills are runtime assets and must trigger CI.
      - "agent/**"
      - "examples/**"
      - "Makefile"
  push:
    branches:
      - main
      - prod
      - "ab/dev2"
  # Nightly full run on the default branch: coverage + the slow/integration
  # suite (INTEGRAL_RUN_SLOW_TESTS=1). Keeps the per-PR gate lean while still
  # exercising everything once a day.
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily

concurrency:
  # PR updates supersede older runs for that PR. Push, manual recovery, and
  # nightly runs are keyed to their exact source/event so a scheduled run
  # cannot cancel source CI that may qualify a release.
  group: >-
    ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || (github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-backend-policy:
    name: Backend guards and pre-commit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so pre-commit can diff against the PR base instead of
          # linting the whole tree (see "Run pre-commit" below).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        # Install from uv.lock, not by re-resolving pyproject's ranges.
        #
        # Most runtime deps are declared as open `>=` ranges, so a fresh resolve
        # meant CI installed whatever the ecosystem published that morning and a
        # major release upstream could break main with no code change. That is
        # not hypothetical: mcp 2.0 dropped `Server.list_tools`, which
        # app/agentive/mcp/server.py registers against, and every backend test
        # errored at import with "AttributeError: 'Server' object has no
        # attribute 'list_tools'" while the same commit passed locally.
        #
        # `--frozen` fails loudly if uv.lock has drifted from pyproject rather
        # than silently resolving around it, so a dependency change that forgets
        # to re-lock is caught here. Resolving less also makes the step faster.
        # [dev]=lint/typecheck for the guards + pre-commit; [test]=pytest-xdist/cov.
        run: |
          python -m pip install --upgrade pip uv
          uv export --frozen --no-hashes --extra dev --extra test \
            --format requirements-txt -o /tmp/ci-requirements.txt
          # The export emits `-e .` for the project itself, resolved relative to
          # this job's working-directory (backend/), so no separate install.
          uv pip install --system -r /tmp/ci-requirements.txt

      - name: Run substrate guards
        run: |
          bash ../.ci/jvspatial_drift_check.sh
          bash ../.ci/graph_contiguousness_check.sh
          bash ../.ci/substrate_domain_drift_check.sh
          bash ../.ci/service_layer_drift_check.sh
          bash ../.ci/core_no_app_import_check.sh
          # Not a substrate guard, but it belongs on a blocking gate: a stale
          # CSP hash breaks the app in the browser only — the build, the type
          # check and every server-side healthcheck stay green.
          bash ../.ci/csp_inline_script_hash_check.sh

      - name: Dependency advisories (backend)
        if: always()
        # Audit the frozen production lock without vulnerability suppressions.
        # The unused python-jose/ecdsa dependency chain has been removed.
        run: bash ../.ci/dependency_audit.sh backend

      - name: Run pre-commit
        if: always()
        # On a PR, lint only what the PR changed. `--all-files` re-runs mypy
        # over the full backend on push, dispatch, and nightly runs.
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install pre-commit
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pre-commit run --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
          else
            pre-commit run --all-files
          fi

  test-backend-contract:
    name: Backend contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv export --frozen --no-hashes --extra dev --extra test \
            --format requirements-txt -o /tmp/ci-requirements.txt
          uv pip install --system -r /tmp/ci-requirements.txt

      - name: F0 Core-only lane
        env:
          TESTING: "1"
          INTEGRAL_CORE_ONLY: "1"
        run: |
          pytest -q --tb=short --durations=20 --junitxml=test-results-core-only.xml \
            tests/core_only/ tests/contract/test_reference_hello_app.py \
            -m "core_only"

      - name: F0 extension-contract lane
        # Per-test scheduling can split the large reference-App files. Worker
        # databases and function-scoped state remain isolated as in the full gate.
        run: make -C .. verify-contract CONTRACT_TEST_WORKERS=2

      - name: Upload contract test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-contract-test-report
          path: |
            backend/test-results-*.xml
            backend/.pytest_cache/verification/contract.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  test-backend-smoke:
    name: Backend smoke and scheduled suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv export --frozen --no-hashes --extra dev --extra test \
            --format requirements-txt -o /tmp/ci-requirements.txt
          uv pip install --system -r /tmp/ci-requirements.txt

      - name: Run smoke tests
        if: github.event_name != 'schedule'
        env:
          TESTING: "1"
        # Pull-request Core gate: smoke only. The scheduled full suite runs
        # instead, while contracts remain a separate parallel lane.
        run: |
          pytest -q --tb=short --durations=20 --junitxml=test-results-backend.xml \
            -n auto --dist loadfile \
            --ignore=tests/domain_apps \
            -m "smoke and not domain_app and not slow"

      - name: Run full scheduled Core suite with slow tests
        if: github.event_name == 'schedule'
        env:
          TESTING: "1"
          INTEGRAL_RUN_SLOW_TESTS: "1"
        # Scheduled CI includes every Core test, including slow tests, while
        # keeping bundled commercial/domain Apps out of the Core release gate.
        run: |
          pytest -q --tb=short --durations=20 --junitxml=test-results-backend.xml \
            -n auto --dist loadfile \
            --ignore=tests/domain_apps -m "not domain_app"

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/test-results-backend.xml
          if-no-files-found: ignore
          retention-days: 7

  # Keep the established `test-backend` check name for branch protection and
  # release qualification while its independent lanes run in parallel.
  test-backend:
    name: test-backend
    if: always()
    needs: [test-backend-policy, test-backend-contract, test-backend-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every backend lane to pass
        env:
          POLICY_RESULT: ${{ needs.test-backend-policy.result }}
          CONTRACT_RESULT: ${{ needs.test-backend-contract.result }}
          SMOKE_RESULT: ${{ needs.test-backend-smoke.result }}
        run: |
          if [ "$POLICY_RESULT" != "success" ] || \
             [ "$CONTRACT_RESULT" != "success" ] || \
             [ "$SMOKE_RESULT" != "success" ]; then
            echo "Backend lanes: policy=$POLICY_RESULT contracts=$CONTRACT_RESULT smoke=$SMOKE_RESULT"
            exit 1
          fi

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint:types
      - name: Run npm run test:run
        run: |
          node --input-type=module -e 'import { availableParallelism } from "node:os"; console.log({ availableCpus: availableParallelism(), maxWorkers: Math.min(4, availableParallelism()) });'
          make -C .. test-frontend

      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: frontend/node_modules/.cache/verification/frontend.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      # lint:types above already checked TypeScript; build assets without a
      # second tsc pass. npm run build still checks types for standalone use.
      - run: npm run build:assets

      - name: Dependency advisories (frontend)
        # Unknown high/critical findings fail even without a published fix.
        # Reviewed build-only exceptions bind advisory, lock and remediation
        # conditions and expire; moderate findings remain visible in the log.
        run: bash ../.ci/dependency_audit.sh frontend
        working-directory: frontend

  artifact-boundary:
    name: Independent Core, SDK, and App artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install wheel tooling
        run: python -m pip install --upgrade uv

      - name: Prove independent package boundaries
        run: make verify-independent-artifacts

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: integral
          POSTGRES_PASSWORD: integral
          POSTGRES_DB: integral_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integral -d integral_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv export --frozen --no-hashes --extra dev --extra test \
            --format requirements-txt -o /tmp/ci-requirements.txt
          uv pip install --system -r /tmp/ci-requirements.txt

      - name: Cache local semantic encoder
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/integral-fastembed
          key: ${{ runner.os }}-semantic-minilm-${{ hashFiles('backend/uv.lock') }}

      - name: Real semantic indexing and retrieval
        env:
          TESTING: "1"
          INTEGRAL_TEST_DB: postgres
          INTEGRAL_RUN_SLOW_TESTS: "1"
          JVSPATIAL_DB_TYPE: postgres
          JVSPATIAL_POSTGRES_DSN: postgresql://integral:integral@localhost:5432/integral_core
          SEMANTIC_TEST_DSN: postgresql://integral:integral@localhost:5432/integral_core
          FASTEMBED_CACHE_PATH: ${{ runner.temp }}/integral-fastembed
        run: |
          pytest -q --tb=short -o addopts='' \
            tests/test_semantic_index_definitions.py tests/test_semantic_indexing_pg.py \
            tests/test_pgvector_driver.py tests/test_pgvector_unavailable_fallback.py \
            tests/test_attachment_search_pg.py

      - name: Postgres spike, contract and App job authorization lane
        env:
          JVSPATIAL_POSTGRES_DSN: postgresql://integral:integral@localhost:5432/integral_core
        # Shared with local qualification: two isolated worker DBs and pools
        # capped at three connections each. App passage authority stays here,
        # rather than repeating it in the real-encoder lane above.
        run: make -C .. test-postgres-ci POSTGRES_TEST_WORKERS=2

      - name: Upload PostgreSQL test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-postgres-test-report
          path: backend/.pytest_cache/verification/postgres-*.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  docker-build-verify:
    runs-on: ubuntu-latest
    # Two full image builds is the single most expensive thing in this workflow
    # and it re-ran on every PR push. Start it alongside the independent source
    # gates; Dockerfile/dependency breakage is caught on merge to main/prod and
    # nightly, which is soon enough — nothing on a feature branch deploys. Add
    # the `docker` label to a PR to opt in.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'docker')
    strategy:
      matrix:
        include:
          - target: api
            context: .
            file: backend/Dockerfile
          - target: web
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          pull: true
          push: false
          load: true
          tags: integral-${{ matrix.target }}:ci
          cache-from: type=gha,scope=verify-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=verify-${{ matrix.target }}

      - name: Record candidate image identity
        env:
          IMAGE_TARGET: ${{ matrix.target }}
          IMAGE_REF: integral-${{ matrix.target }}:ci
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          IMAGE_PLATFORM_AND_SIZE="$(docker image inspect --format '{{.Os}}/{{.Architecture}} {{.Size}} bytes' "$IMAGE_REF")"
          if [ -z "$IMAGE_ID" ] || [ -z "$IMAGE_PLATFORM_AND_SIZE" ]; then
            echo "::error::Docker did not retain the built image identity."
            exit 1
          fi
          {
            echo "### Docker ${IMAGE_TARGET} candidate build"
            echo "- Source revision: ${SOURCE_REVISION}"
            echo "- Local Docker image reference: ${IMAGE_REF}"
            echo "- Image ID (config digest): ${IMAGE_ID}"
            echo "- Platform and size: ${IMAGE_PLATFORM_AND_SIZE}"
            echo "- Output: loaded on the ephemeral runner; no registry push or deployment"
          } >> "$GITHUB_STEP_SUMMARY"
