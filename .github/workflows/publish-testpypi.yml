name: Publish integral-core to TestPyPI

# A push to main publishes when backend/pyproject.toml is a pre-release
# that is not already on TestPyPI, then records v<version>.
# A v* tag push and workflow_dispatch do the same for that commit.
# Final versions are handled by publish-pypi.yml.
#
# Trusted Publishing (OIDC) — no API token in this repo.
#
# ONE-TIME SETUP:
#   TestPyPI → https://test.pypi.org/manage/account/publishing/
#     Project: integral-core | Owner: V75inc | Repo: integral-core
#     Workflow: publish-testpypi.yml | Environment: testpypi
#   GitHub → environment named `testpypi`
# See RELEASING.md.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Pre-release tag to build and publish (e.g. v0.1.1rc1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distributions (pre-release)
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.classify.outputs.publish }}
      owns: ${{ steps.classify.outputs.owns }}
      already: ${{ steps.classify.outputs.already }}
      version: ${{ steps.classify.outputs.version }}
      dist_digests: ${{ steps.digest.outputs.dist_digests }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine packaging uv

      - name: Decide whether this revision publishes to TestPyPI
        id: classify
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          RELEASE_INDEX: testpypi
        run: python3 .github/scripts/classify_release.py

      - name: Set up Node
        if: steps.classify.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bundle the web workspace into the wheel
        if: steps.classify.outputs.publish == 'true'
        working-directory: ${{ github.workspace }}
        run: .ci/bundle_web_assets.sh && .ci/bundle_resident_harness.sh

      - name: Build sdist and wheel
        if: steps.classify.outputs.publish == 'true'
        run: python -m build

      - name: Check distributions
        if: steps.classify.outputs.publish == 'true'
        run: python -m twine check dist/*

      - name: Verify the exact wheel that will be published
        id: digest
        if: steps.classify.outputs.publish == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          DIGESTS=$(python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          files = sorted(p for p in Path("backend/dist").iterdir() if p.is_file())
          if not files:
              raise SystemExit("no distributions")
          print(json.dumps({p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}, separators=(",", ":")))
          PY
          )
          echo "dist_digests=$DIGESTS" >> "$GITHUB_OUTPUT"
          WHEEL=$(find backend/dist -maxdepth 1 -name 'integral_core-*.whl' -print -quit)
          test -n "$WHEEL"
          python3 - "$WHEEL" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          if not any(name.endswith("app/web/static/index.html") for name in names):
              raise SystemExit("wheel is missing the built frontend")
          if not any(name.endswith("app/resident_harness/app.yaml") for name in names):
              raise SystemExit("wheel is missing the resident harness")
          PY
          INTEGRAL_WHEEL_PATH="$PWD/$WHEEL" make verify-artifact
          make verify-clean-install verify-sdk-artifact verify-external-asset-register

      - name: Upload distributions
        if: steps.classify.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Refuse distributions whose digests were not verified
        env:
          EXPECTED_DIGESTS: ${{ needs.build.outputs.dist_digests }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          expected = json.loads(os.environ["EXPECTED_DIGESTS"])
          actual = {
              p.name: hashlib.sha256(p.read_bytes()).hexdigest()
              for p in Path("dist").iterdir()
              if p.is_file()
          }
          if actual != expected:
              raise SystemExit(f"digest mismatch\nexpected={expected}\nactual={actual}")
          PY

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  record-tag:
    name: Record the release tag
    needs: [build, publish-testpypi]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.build.outputs.owns == 'true' &&
      (needs.publish-testpypi.result == 'success' || needs.build.outputs.already == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the published commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Push v<version> when it is missing
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/v${VERSION}"
