name: Publish integral-core to TestPyPI

# Pre-release tags only (PEP 440: rc / a / b), e.g. v0.1.1rc1 → TestPyPI.
# Final tags (v0.1.1) are handled by publish-pypi.yml.
#
# Trusted Publishing (OIDC) — no API token in this repo.
#
# ONE-TIME SETUP:
#   TestPyPI → https://test.pypi.org/manage/account/publishing/
#     Project: integral-core | Owner: V75inc | Repo: integral-core
#     Workflow: publish-testpypi.yml | Environment: testpypi
#   GitHub → environment named `testpypi`
# See RELEASING.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Pre-release tag to build and publish (e.g. v0.1.1rc1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distributions (pre-release)
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
      dist_digests: ${{ steps.digest.outputs.dist_digests }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine packaging uv

      - name: Verify tag matches version and classify pre-release
        id: classify
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.tag }}"
          else
            REF="${GITHUB_REF_NAME}"
          fi
          TAG="${REF#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG ref=$REF"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $REF does not match backend/pyproject.toml version ($PKG)"
            exit 1
          fi
          PRE=$(python -c "from packaging.version import Version; print('true' if Version('$PKG').is_prerelease else 'false')")
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE"
          if [ "$PRE" != "true" ]; then
            echo "::notice::Final tag $REF — skipping TestPyPI (see publish-pypi.yml)"
          fi

      - name: Build sdist and wheel
        if: steps.classify.outputs.prerelease == 'true'
        run: python -m build

      - name: Check distributions
        if: steps.classify.outputs.prerelease == 'true'
        run: python -m twine check dist/*

      - name: Verify the exact wheel that will be published
        id: digest
        if: steps.classify.outputs.prerelease == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          DIGESTS=$(python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          files = sorted(p for p in Path("backend/dist").iterdir() if p.is_file())
          if not files:
              raise SystemExit("no distributions")
          print(json.dumps({p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}, separators=(",", ":")))
          PY
          )
          echo "dist_digests=$DIGESTS" >> "$GITHUB_OUTPUT"
          WHEEL=$(find backend/dist -maxdepth 1 -name 'integral_core-*.whl' -print -quit)
          test -n "$WHEEL"
          INTEGRAL_WHEEL_PATH="$PWD/$WHEEL" make verify-artifact
          make verify-clean-install verify-sdk-artifact verify-external-asset-register

      - name: Upload distributions
        if: steps.classify.outputs.prerelease == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: needs.build.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Refuse distributions whose digests were not verified
        env:
          EXPECTED_DIGESTS: ${{ needs.build.outputs.dist_digests }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          expected = json.loads(os.environ["EXPECTED_DIGESTS"])
          actual = {
              p.name: hashlib.sha256(p.read_bytes()).hexdigest()
              for p in Path("dist").iterdir()
              if p.is_file()
          }
          if actual != expected:
              raise SystemExit(f"digest mismatch\nexpected={expected}\nactual={actual}")
          PY

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
