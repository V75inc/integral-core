name: Publish integral-core to TestPyPI

# Build sdist + wheel from backend/ and publish via TestPyPI Trusted Publishing
# (OIDC — no API token secret in this repo).
#
# Starters: every version tag publishes to TestPyPI only. Production PyPI is
# deferred until the first final release cut (see RELEASING.md).
#
# Trigger: pushing a version tag, or manual workflow_dispatch (retry).
#
# ONE-TIME SETUP (maintainer, on TestPyPI):
#   https://test.pypi.org/manage/account/publishing/
#     Add a "pending publisher" for project `integral-core`:
#       Owner:        V75inc
#       Repository:   integral-core
#       Workflow:     publish-testpypi.yml
#       Environment:  testpypi
#   In this GitHub repo, create environment `testpypi`
#   (Settings → Environments). See RELEASING.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.0rc1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine packaging

      - name: Verify tag matches pyproject version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.tag }}"
          else
            REF="${GITHUB_REF_NAME}"
          fi
          TAG="${REF#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG ref=$REF"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $REF does not match backend/pyproject.toml version ($PKG)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
