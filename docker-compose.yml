# Local / demo stack for integral-core.
#
#   docker compose up --build
#
# Opens:
#   SPA  http://localhost:9006
#   API  http://localhost:4000/docs
#   PG   localhost:5433
#
# Create .env with ./scripts/bootstrap_env.sh .env .env.example before start.
# A dedicated init container provisions the reviewed storage catalog on
# a fresh database. The API performs verification only; existing databases
# without a catalog require reviewed migration.
# Compose requires an operator-provided JWT secret and never supplies a fallback.
services:
  # Postgres 16 + pgvector — the integral default DB. jvspatial Phase C
  # (2026-05-26) uses asyncpg + JSONB for OLTP, recursive CTEs for
  # walker BFS, and the pgvector extension for hybrid graph+vector
  # queries. Host port :5433 so a default-port (5432) Postgres on the
  # host or another container (e.g. jvspatial-pg dev) does not collide.
  db:
    image: pgvector/pgvector:pg16
    container_name: integral-pg
    environment:
      POSTGRES_USER: integral
      POSTGRES_PASSWORD: integral
      POSTGRES_DB: integral
    ports:
      - "5433:5432"
    volumes:
      - integral_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integral -d integral"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-init:
    build: &api-build
      context: .
      dockerfile: backend/Dockerfile
      target: core
    command: ["python", "-m", "app.services.storage_indexes.provision"]
    healthcheck:
      disable: true
    environment:
      INTEGRAL_ENV_FILE: /dev/null
      INTEGRAL_MIGRATION_POSTGRES_DSN: postgresql://integral:integral@db:5432/integral
      JVSPATIAL_POSTGRES_DSN: postgresql://integral:integral@db:5432/integral
      INTEGRAL_RUNTIME_POSTGRES_USER: integral_runtime
      INTEGRAL_RUNTIME_POSTGRES_PASSWORD: ${INTEGRAL_LOCAL_POSTGRES_RUNTIME_PASSWORD:?run scripts/bootstrap_env.sh to generate the PostgreSQL runtime password}
      INTEGRAL_INITIAL_INDEX_PLAN_PATH: /data/storage-initial-plan.json
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - integral_index_plans:/data

  api:
    build: *api-build
    ports:
      - "4000:4000"
    env_file:
      - path: .env
        required: false
    environment: &api-env
      HOST: 0.0.0.0
      PORT: "4000"
      DEBUG: "False"
      INTEGRAL_CORE_ONLY: "1"
      JVSPATIAL_HOST: 0.0.0.0
      JVSPATIAL_PORT: "4000"
      JVSPATIAL_DEBUG: "false"
      INTEGRAL_NATIVE_MODEL: ${INTEGRAL_NATIVE_MODEL:-ollama/deepseek-v4.1-flash:cloud}
      INTEGRAL_NATIVE_CREDENTIAL_REF: ${INTEGRAL_NATIVE_CREDENTIAL_REF:-}
      # Inside the compose network the service name "db" resolves; the
      # service listens on its own :5432 here (container port, not the
      # :5433 host mapping).
      JVSPATIAL_DB_TYPE: postgres
      JVSPATIAL_POSTGRES_INDEX_CREATION: managed
      JVSPATIAL_AUTO_CREATE_INDEXES: "false"
      # main.py builds the encoded DSN from these runtime-only credentials.
      JVSPATIAL_POSTGRES_DSN: ""
      POSTGRES_USER: integral_runtime
      POSTGRES_PASSWORD: ${INTEGRAL_LOCAL_POSTGRES_RUNTIME_PASSWORD:?run scripts/bootstrap_env.sh to generate the PostgreSQL runtime password}
      POSTGRES_DB: integral
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # A signing key must be supplied by the operator in the local .env file.
      # Do not add a fallback here: docker-compose.yml is a deployable stack.
      JVSPATIAL_JWT_SECRET_KEY: ${JVSPATIAL_JWT_SECRET_KEY:?set JVSPATIAL_JWT_SECRET_KEY in .env}
      JVSPATIAL_JWT_EXPIRE_MINUTES: ${JVSPATIAL_JWT_EXPIRE_MINUTES:-60}
      JVSPATIAL_REFRESH_EXPIRE_DAYS: ${JVSPATIAL_REFRESH_EXPIRE_DAYS:-7}
      JVSPATIAL_REFRESH_TOKEN_ROTATION: ${JVSPATIAL_REFRESH_TOKEN_ROTATION:-true}
      INTEGRAL_SESSION_IDLE_TIMEOUT_SECONDS: ${INTEGRAL_SESSION_IDLE_TIMEOUT_SECONDS:-0}
      INTEGRAL_SESSION_SILENT_REFRESH_ACTIVITY_SECONDS: ${INTEGRAL_SESSION_SILENT_REFRESH_ACTIVITY_SECONDS:-900}
      INTEGRAL_SESSION_REFRESH_LEAD_SECONDS: ${INTEGRAL_SESSION_REFRESH_LEAD_SECONDS:-120}
      INTEGRAL_SESSION_MIN_REFRESH_INTERVAL_SECONDS: ${INTEGRAL_SESSION_MIN_REFRESH_INTERVAL_SECONDS:-30}
      INTEGRAL_SESSION_RENEWAL_REQUEST_TIMEOUT_SECONDS: ${INTEGRAL_SESSION_RENEWAL_REQUEST_TIMEOUT_SECONDS:-20}
      # OAuth credentials are encrypted at rest. Generate once with
      # scripts/bootstrap_env.sh and retain this key with the deployment.
      JVSPATIAL_OAUTH_KEY_ENCRYPTION_KEY: ${JVSPATIAL_OAUTH_KEY_ENCRYPTION_KEY:?run scripts/bootstrap_env.sh to generate the OAuth encryption key}
      INTEGRAL_CREDENTIAL_ENC_KEY: ${INTEGRAL_CREDENTIAL_ENC_KEY:?run scripts/bootstrap_env.sh to generate the storage encryption key}
      JVSPATIAL_CORS_ORIGINS: http://localhost:9006,http://127.0.0.1:9006,http://localhost:4000,http://127.0.0.1:4000
      APP_BASE_URL: http://localhost:9006
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      # Attachment bytes live under /data/files (the image's writable root).
      # Keep this volume with the Postgres backup for a complete restore.
      - integral_db:/data

  # Independent durable event delivery, required for other clients to see
  # committed mutations. Same artifact, stores and restricted serving role.
  event-worker:
    build: *api-build
    command: ["python", "-m", "app.cli", "worker", "events"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: *api-env
    depends_on:
      storage-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    volumes:
      - integral_db:/data
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "worker", "events", "--check"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NGINX_CONF: nginx.docker.conf
        VITE_API_URL:
    environment:
      NGINX_ENVSUBST_FILTER: "^CSP_"
    ports:
      - "9006:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  integral_db:
  integral_pg:
  integral_index_plans:
