<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    globalThis.process = globalThis.process || { env: { NODE_ENV: 'development' } };
  </script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('t75_theme');
        if (t === 'light') document.documentElement.classList.remove('theme-dark');
        else document.documentElement.classList.add('theme-dark');
      } catch (e) {
        document.documentElement.classList.add('theme-dark');
      }
    })();
  </script>

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Integral connects your tracks, spaces, and teams—one workspace to see what matters across your professional life." />
